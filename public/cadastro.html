<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TAS | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/login-cadastro.css">
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body>
  <!--header inicio-->
 
    <div class="header">
        <div class="container">
            <a href="index.html" class="logo-container">
                <img src="./assets/imgs/logotipo.png" alt="Logo TAS" class="logo-image">
            </a>
      <ul class="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="minhatrajetoria.html">Minha Trajetoria</a></li>
                <li class="divider">|</li>
                <li><a href="login.html">Login</a></li>
                <li><a href="cadastro.html" class="agora">Cadastro</a></li>
            </ul>
    </div>
  </div>
  <!--header fim-->

  <div class="cadastro">
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Bem-vindo!</h2>
        <div class="formulario">
          <!--
                         Para inserir mais um campo, copie uma das inputs abaixo.
                         Assim que inserir vá para o script abaixo.
                     -->
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome" />
          </div>
          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>
          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>
          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>
           <div class="campo">
  <span>Username:</span>
  <input id="username_input" type="text" placeholder="seu_username" />
</div>
          <button class="botao" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>
        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

  <!--footer inicio-->
  <div class="footer">
    <div class="container">
    
    </div>
  </div>
  <!--footer fim-->
</body>

<script>

   function cadastrar() {
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var usernameVar = username_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;

    if (nomeVar == "" || emailVar == "" || usernameVar == "" ||
        senhaVar == "" || confirmacaoSenhaVar == "") {
      mostrarErro("Preencha todos os campos!");
      return false;
    }
    if (senhaVar != confirmacaoSenhaVar) {
      mostrarErro("A senha e a confirmação não são iguais!");
      return false;
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        usernameServer: usernameVar,
        senhaServer: senhaVar
      })
    })
      .then(function (resposta) {
        if (resposta.ok) {
          mostrarErro("Cadastro realizado com sucesso! Redirecionando para o Login...");
          setTimeout(function () { window.location = "login.html"; }, 2000);
        } else {
          return resposta.text().then(function (texto) {
            throw texto || "Houve um erro ao tentar realizar o cadastro!";
          });
        }
      })
      .catch(function (erro) {
        console.log("#ERRO: " + erro);
        mostrarErro(String(erro));
      });

    return false;
  }

  function mostrarErro(texto) {
    cardErro.style.display = "block";
    mensagem_erro.textContent = texto;
    setTimeout(sumirMensagem, 5000);
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
  
</script>


</html>
